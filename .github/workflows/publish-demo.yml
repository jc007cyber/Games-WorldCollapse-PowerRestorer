name: Publish single-file HTML demo to Releases

on:
  push:
    paths:
      - .github/workflows/publish-demo.yml
      - game/index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Prepare single HTML file
        shell: bash
        run: |
          set -euo pipefail
          test -s game/index.html
          mkdir -p dist
          cp game/index.html dist/WorldCollapse-PowerRestorer-Demo-v0.1.0-beta.html

      - name: Publish single HTML asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-beta"
          HTML="dist/WorldCollapse-PowerRestorer-Demo-v0.1.0-beta.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HTML" --clobber
            gh release delete-asset "$TAG" "WorldCollapse-PowerRestorer-HTML-Demo-v0.1.0-beta.zip" --yes || true
            gh release edit "$TAG" --notes "单文件 HTML 浏览器试玩版：下载 .html 后用浏览器打开。iPhone 上的文件预览可能无法完整运行 JavaScript，建议部署 GitHub Pages 获得免下载的直接试玩链接。" --prerelease
          else
            gh release create "$TAG" "$HTML" \
              --target "$GITHUB_SHA" \
              --title "世界崩塌·权能恢复者 - 试玩版 V0.1 Beta" \
              --notes "单文件 HTML 浏览器试玩版：下载 .html 后用浏览器打开。iPhone 上的文件预览可能无法完整运行 JavaScript，建议部署 GitHub Pages 获得免下载的直接试玩链接。" \
              --prerelease
          fi
